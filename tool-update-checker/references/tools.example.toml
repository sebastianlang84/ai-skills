# Example config for ~/.config/tool-update-checker/tools.toml
#
# Optional per-tool fields:
# groups = ["core", "core", "extensions"]
# current = "<known installed source SHA/tag>"
# Then run:
#   python3 ~/.agents/skills/tool-update-checker/scripts/check_updates.py --group core
#   python3 ~/.agents/skills/tool-update-checker/scripts/check_updates.py --actionable-only --exit-code
#   python3 ~/.agents/skills/tool-update-checker/scripts/check_updates.py --actionable-only --notify

[[tool]]
name = "ast-grep"
kind = "npm-global"
package = "@ast-grep/cli"
groups = ["core"]

[[tool]]
name = "bun"
kind = "npm-global"
package = "bun"
groups = ["core", "extensions"]

[[tool]]
name = "some-local-clone"
kind = "git-repo"
path = "/home/wasti/dev/some-repo"
remote = "origin"
branch = "main"
groups = ["core", "repos"]

# Remote-only GitHub example
[[tool]]
name = "some-github-extension"
kind = "github-release"
repo = "owner/repo"
current = "v1.2.3"
groups = ["extensions"]

# Validate a local skill folder only. The checker verifies SKILL.md frontmatter
# and reports local uncommitted changes when the folder is inside a Git repo.
[[tool]]
name = "tool-update-checker"
kind = "skill-local"
path = "~/.agents/skills/tool-update-checker"
groups = ["skills"]

# Track a skill that lives in a local Git checkout.
# `source_path` defaults to the skill path relative to the repo root.
[[tool]]
name = "tool-update-checker"
kind = "skill-git"
path = "~/.agents/skills/tool-update-checker"
remote = "origin"
branch = "main"
groups = ["skills"]

# Track a whole skills root such as the global skills checkout or a repo's
# .agents/skills directory. This validates all direct child SKILL.md files.
[[tool]]
name = "global-ai-skills"
kind = "skills-root-git"
path = "~/.agents/skills"
remote = "origin"
branch = "main"
groups = ["skills", "global-skills"]

# Track a skills.sh skill. Without `current`, the checker reports latest source
# visibility as info; set `current` to the source commit SHA you installed from
# when you want update-available/up-to-date comparison.
[[tool]]
name = "improve-codebase-architecture"
kind = "skills-sh"
path = "~/.agents/skills/improve-codebase-architecture"
source = "mattpocock/skills/improve-codebase-architecture"
# current = "abc123def456"
groups = ["skills"]
